name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          pip install -e .[dev]

      - name: Validate runtime
        run: node cli.js validate

      - name: Lint with ruff
        run: ruff check runtime mcp_servers figma-agent-core

      - name: Format check with black
        run: black --check runtime mcp_servers figma-agent-core

      - name: Type check with mypy
        run: mypy runtime mcp_servers figma-agent-core

      - name: Run core test tier with coverage
        run: pytest -m core -v --cov --cov-report=term-missing

      - name: Run MCP smoke test tier
        run: pytest -m mcp -v

      - name: Run integration tests (mock provider)
        run: pytest tests/integration/ -v

  posix-path-traversal:
    name: POSIX path-traversal checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          if [ -f runtime/requirements.txt ]; then pip install -r runtime/requirements.txt; fi
          if [ -f figma-agent-core/requirements.txt ]; then pip install -r figma-agent-core/requirements.txt; fi

      - name: Run path-traversal test subset
        run: pytest -k traversal -v --no-cov

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentic-loop .

      - name: Validate inside container
        run: docker run --rm agentic-loop validate

      - name: Run mock pipeline inside container
        run: docker run --rm agentic-loop run "ci test" --provider mock --max-iterations 2
