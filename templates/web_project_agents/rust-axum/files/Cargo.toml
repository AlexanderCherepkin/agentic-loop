[package]
name = "rust-axum-starter"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "migrate"] }
jsonwebtoken = "9.2"
bcrypt = "0.15"
dotenvy = "0.15"
askama = "0.12"
askama_axum = "0.4"
