[pytest]
minversion = 7.0
testpaths = tests runtime
addopts = -q
markers =
    core: fast unit tests covering runtime phase transitions, memory, observability, backend bridge, and integration pipeline (no external tokens)
    mcp: MCP server smoke tests covering registry, gateway, server initialization, and tool pings (mocked/local servers)
    figma: Figma integration tests requiring FIGMA_TOKEN and FIGMA_URL (network-dependent)
    backend: backend bridge unit tests (subset of core)
    integration: end-to-end pipeline tests (subset of core)
    runtime: runtime internals (subset of core)
    slow: tests expected to take more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
