[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-loop"
version = "0.1.0"
description = "Multi-agent AI system with hierarchical safety-first architecture"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.55.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "black>=24.0",
    "mypy>=1.10",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "runtime"]
addopts = "-q --cov=runtime --cov=mcp_servers --cov=figma-agent-core --cov-report=term-missing --cov-fail-under=60"
markers = [
    "core: fast unit tests covering runtime phase transitions, memory, observability, backend bridge, and integration pipeline (no external tokens)",
    "mcp: MCP server smoke tests covering registry, gateway, server initialization, and tool pings (mocked/local servers)",
    "figma: Figma integration tests requiring FIGMA_TOKEN and FIGMA_URL (network-dependent)",
    "backend: backend bridge unit tests (subset of core)",
    "integration: end-to-end pipeline tests (subset of core)",
    "runtime: runtime internals (subset of core)",
    "slow: tests expected to take more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["runtime", "mcp_servers", "figma-agent-core"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\\.pyi?$'
extend-exclude = '''
/(
    \\.venv
  | \\.git
  | \\.claude
  | graphify-out
  | node_modules
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long — handled by black
    "B008",  # do not perform function calls in argument defaults (dataclass defaults)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    "\\.venv/",
    "node_modules/",
    "graphify-out/",
]
