id: django-htmx
name: Django + HTMX
base_category: Веб-сервис
language: python
description: |
  Классический server-side rendered starter: Django 5 с HTMX для динамических
  фрагментов, django-allauth-заготовкой и Bootstrap-стилями.
tags:
  - django
  - htmx
  - server-side-rendering
  - bootstrap
  - allauth
stack:
  backend: Django 5.x
  frontend: HTMX 1.9 + Bootstrap 5
  db: PostgreSQL / SQLite
  auth: django-allauth
variables:
  backend_port: 8000
